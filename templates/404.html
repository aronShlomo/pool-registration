<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found</title>

    <style>
      body {
        background: #e9f7ff;

        font-family: Arial, sans-serif;

        display: flex;

        justify-content: center;

        align-items: center;

        height: 100vh;

        margin: 0;
      }

      .box {
        background: white;

        padding: 40px;

        text-align: center;

        border-radius: 15px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h1 {
        color: #0077b6;

        font-size: 60px;
      }

      p {
        color: #555;

        font-size: 18px;
      }

      a {
        display: inline-block;

        margin-top: 20px;

        padding: 12px 25px;

        background: #0077b6;

        color: white;

        text-decoration: none;

        border-radius: 8px;
      }

      a:hover {
        background: #005f8f;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>404</h1>

      <p>Sorry, this page does not exist.</p>

      <a href="/"> Go Home </a>
    </div>
  </body>
</html>
