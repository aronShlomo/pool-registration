<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Millrod Swim | Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --b: #0b6fb8;
        --c: #16b6d9;
        --bg: #eef8fd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Poppins, sans-serif;
        background: var(--bg);
        color: #223;
      }
      .hero {
        background: linear-gradient(135deg, #0b6fb8, #16b6d9);
        color: #fff;
        padding: 70px 20px;
        text-align: center;
      }
      .hero h1 {
        font-size: 3rem;
        margin: 0.2em;
      }
      .hero p {
        max-width: 700px;
        margin: auto;
        opacity: 0.95;
      }
      .wrap {
        max-width: 1050px;
        margin: -50px auto 40px;
        padding: 0 20px;
      }
      .card {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
        padding: 36px;
      }
      h2 {
        color: var(--b);
        border-bottom: 3px solid #dff5fb;
        padding-bottom: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid #d3dde8;
        border-radius: 12px;
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--c);
        box-shadow: 0 0 0 4px rgba(22, 182, 217, 0.15);
      }
      textarea {
        min-height: 110px;
      }
      .section {
        margin: 34px 0;
      }
      button {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #0b6fb8, #16b6d9);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        transform: translateY(-1px);
      }
      .badges {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .badge {
        background: rgba(255, 255, 255, 0.15);
        padding: 8px 14px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>🏊 Millrod Swim Academy</h1>
      <p>
        Professional swimming instruction for children and adults. Complete the
        secure registration below to reserve your place.
      </p>
      <div class="badges">
        <div class="badge">Certified Instructors</div>
        <div class="badge">Small Class Sizes</div>
        <div class="badge">Safety First</div>
      </div>
    </section>
    <div class="wrap">
      <div class="card">
        <form action="/register" method="POST">
          <div class="section">
            <h2>Participant Information</h2>
            <div class="grid">
              <div>
                <label>First Name</label><input name="first_name" required />
              </div>
              <div>
                <label>Last Name</label><input name="last_name" required />
              </div>
              <div>
                <label>Date of Birth</label
                ><input type="date" name="date_of_birth" required />
              </div>
              <div>
                <label>Gender</label
                ><select name="gender">
                  <option>Male</option>
                  <option>Female</option>
                  <option>Prefer not to say</option>
                </select>
              </div>
              <div>
                <label>Email</label><input type="email" name="email" required />
              </div>
              <div>
                <label>Phone</label><input name="phone_number" required />
              </div>
            </div>
            <label>Home Address</label><textarea name="home_address"></textarea>
          </div>
          <div class="section">
            <h2>Parent / Guardian</h2>
            <div class="grid">
              <div><label>Name</label><input name="parent_guardian" /></div>
              <div>
                <label>Relationship</label><input name="relationship" />
              </div>
              <div><label>Phone</label><input name="parent_phone" /></div>
              <div>
                <label>Email</label><input type="email" name="parent_email" />
              </div>
            </div>
          </div>
          <div class="section">
            <h2>Emergency Contact</h2>
            <div class="grid">
              <div>
                <label>Name</label><input name="emergency_contact_name" />
              </div>
              <div><label>Phone</label><input name="emergency_phone" /></div>
            </div>
          </div>
          <div class="section">
            <h2>Agreement</h2>
            <label
              ><input type="checkbox" name="agreement" required /> I certify the
              information is accurate and agree to the safety policies.</label
            >
          </div>
          <button>Complete Registration</button>
        </form>
      </div>
    </div>
  </body>
</html>
