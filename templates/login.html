<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Millrod Swim Academy Admin Login</title>

    <style>
      body {
        background: #e9f7ff;

        font-family: Arial, sans-serif;

        display: flex;

        justify-content: center;

        align-items: center;

        height: 100vh;
      }

      .login-box {
        background: white;

        width: 350px;

        padding: 35px;

        border-radius: 15px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;

        color: #0077b6;

        margin-bottom: 25px;
      }

      input {
        width: 100%;

        padding: 12px;

        margin-bottom: 15px;

        border: 1px solid #ccc;

        border-radius: 8px;
      }

      button {
        width: 100%;

        padding: 12px;

        background: #0077b6;

        color: white;

        border: none;

        border-radius: 8px;

        cursor: pointer;

        font-size: 16px;
      }

      button:hover {
        background: #005f8f;
      }

      .error {
        color: red;

        text-align: center;

        margin-bottom: 15px;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h2>🏊 Millrod Admin</h2>

      {% if error %}

      <p class="error">{{ error }}</p>

      {% endif %}

      <form method="POST">
        <input type="text" name="username" placeholder="Username" required />

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
