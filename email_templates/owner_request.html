<h2>New Lesson Request</h2>

<p><b>Name:</b> {{ name }}</p>
<p><b>Lesson Type:</b> {{ lesson_type }}</p>
<p><b>Package:</b> {{ package }}</p>
<p><b>Date:</b> {{ lesson_date }}</p>
<p><b>Time:</b> {{ lesson_time }}</p>
<p><b>Price:</b> {{ price }}</p>

<br />

<a
  href="{{ DOMAIN }}/approve-booking?booking_id={{ booking_id }}"
  style="
    background: #28a745;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 6px;
  "
>
  ✔ Approve Booking
</a>

<br /><br />

<a
  href="{{ DOMAIN }}/reject-booking?booking_id={{ booking_id }}"
  style="
    background: #dc3545;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 6px;
  "
>
  ✖ Reject Booking
</a>
