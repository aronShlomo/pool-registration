<h2>Your Lesson Has Been Approved!</h2>

<p>Your lesson request has been approved.</p>

<p><b>Date:</b> {{ booking.lesson_date }}</p>
<p><b>Time:</b> {{ booking.lesson_time }}</p>
<p><b>Amount Due:</b> {{ booking.price }}</p>

<br />

<a
  href="{{ DOMAIN }}/pay-now?booking_id={{ booking.id }}"
  style="
    background: #007bff;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 6px;
  "
>
  💳 Pay Now
</a>

<br /><br />

<a
  href="{{ DOMAIN }}/pay-later?booking_id={{ booking.id }}"
  style="
    background: #ffc107;
    color: black;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 6px;
  "
>
  🕒 Pay Later (Cash / Zelle)
</a>
